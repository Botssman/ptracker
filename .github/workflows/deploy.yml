name: Деплой на сервер

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настройка SSH ключа
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
          # SSH конфиг с keepalive чтобы не рвалось соединение
          cat > ~/.ssh/config << EOF
          Host server
            HostName ${{ secrets.SERVER_IP }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 60
            TCPKeepAlive yes
          EOF

      - name: Копирование исходников на сервер
        run: |
          rsync -avz --delete \
            -e "ssh" \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.next' \
            --exclude='prisma/dev.db' \
            --exclude='public/uploads' \
            ./ server:/var/www/ptracker/

      - name: Установка зависимостей
        run: |
          ssh server << 'DEPLOY'
          cd /var/www/ptracker
          export PATH="/root/.bun/bin:$PATH"
          bun install
          DEPLOY

      - name: Prisma миграция
        run: |
          ssh server << 'DEPLOY'
          cd /var/www/ptracker
          export PATH="/root/.bun/bin:$PATH"
          bun prisma generate
          bun prisma db push --skip-generate
          DEPLOY

      - name: Сборка проекта
        run: |
          ssh server << 'DEPLOY'
          cd /var/www/ptracker
          export PATH="/root/.bun/bin:$PATH"
          systemctl stop ptracker || true
          rm -rf .next
          bun run build
          DEPLOY

      - name: Настройка nginx
        run: |
          ssh server << 'DEPLOY'
          # Исправляем порт в nginx: 10801 → 3000 (только для ptracker)
          if grep -q '10801' /etc/nginx/sites-enabled/ptracker 2>/dev/null; then
            sed -i 's/10801/3000/g' /etc/nginx/sites-enabled/ptracker
            nginx -t && systemctl reload nginx
            echo "nginx: порт исправлен на 3000"
          else
            echo "nginx: порт уже правильный"
          fi
          DEPLOY

      - name: Миграция паролей и запуск
        run: |
          ssh server << 'DEPLOY'
          cd /var/www/ptracker
          export PATH="/root/.bun/bin:$PATH"

          # Хешируем пароли если они ещё в открытом виде
          bun scripts/hash-passwords.ts || true

          # Обновляем systemd сервис
          cat > /etc/systemd/system/ptracker.service << 'SERVICE'
          [Unit]
          Description=Purchase Tracker
          After=network.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=/var/www/ptracker
          ExecStart=/root/.bun/bin/bun run node_modules/.bin/next start
          Restart=on-failure
          RestartSec=10
          Environment=NODE_ENV=production
          Environment=PORT=3000

          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl daemon-reload
          systemctl start ptracker
          sleep 5
          systemctl status ptracker --no-pager -l
          echo "Деплой завершён!"
          DEPLOY
