name: Деплой на сервер

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настройка SSH ключа
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Копирование исходников на сервер
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.next' \
            --exclude='prisma/dev.db' \
            --exclude='public/uploads' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/var/www/ptracker/

      - name: Сборка и запуск на сервере
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'DEPLOY'
          cd /var/www/ptracker
          export PATH="/root/.bun/bin:$PATH"

          # Устанавливаем зависимости
          bun install

          # Генерируем Prisma клиент
          bun prisma generate
          bun prisma db push --skip-generate

          # Останавливаем сервис перед сборкой
          systemctl stop ptracker || true

          # Удаляем старый билд
          rm -rf .next

          # Собираем проект на сервере (Prisma клиент будет тот же что и при работе)
          bun run build

          # Обновляем systemd сервис
          cat > /etc/systemd/system/ptracker.service << 'SERVICE'
          [Unit]
          Description=Purchase Tracker
          After=network.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=/var/www/ptracker
          ExecStart=/root/.bun/bin/bun run node_modules/.bin/next start
          Restart=on-failure
          RestartSec=10
          Environment=NODE_ENV=production
          Environment=PORT=3000

          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl daemon-reload
          systemctl start ptracker
          sleep 5
          systemctl status ptracker --no-pager -l
          echo "✅ Деплой завершён!"
          DEPLOY
