name: Деплой на сервер

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Bun
        uses: oven-sh/setup-bun@v2

      - name: Установить зависимости
        run: bun install

      - name: Генерация Prisma клиента
        run: bun prisma generate

      - name: Сборка проекта
        run: bun run build
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Настройка SSH ключа
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Копирование файлов на сервер
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='prisma/dev.db' \
            --exclude='public/uploads' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/var/www/ptracker/

      - name: Установка и перезапуск на сервере
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'DEPLOY'
          cd /var/www/ptracker

          # Обновляем systemd сервис на next start (не standalone)
          cat > /etc/systemd/system/ptracker.service << 'SERVICE'
          [Unit]
          Description=Purchase Tracker
          After=network.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=/var/www/ptracker
          ExecStart=/root/.bun/bin/bun run node_modules/.bin/next start
          Restart=on-failure
          RestartSec=10
          Environment=NODE_ENV=production
          Environment=PORT=3000

          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl daemon-reload

          # Устанавливаем зависимости и генерируем Prisma
          export PATH="/root/.bun/bin:$PATH"
          bun install
          bun prisma generate
          bun prisma db push --skip-generate

          # Удаляем старый standalone билд если есть
          rm -rf .next/standalone

          systemctl restart ptracker
          sleep 3
          systemctl status ptracker --no-pager -l
          echo "✅ Деплой завершён!"
          DEPLOY
